[project]
name = "plan-gastos-api"
version = "0.1.0"
description = "Backend base para la app Plan Gastos"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.111.0",
  "uvicorn[standard]>=0.30.0",
  "sqlalchemy>=2.0.30",
  "alembic>=1.13.0",
  "psycopg[binary]>=3.1.18",
  "pydantic-settings>=2.2.1",
  "firebase-admin>=6.5.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "httpx>=0.27.0",
]

[tool.setuptools]
packages = [
  "app",
  "app.infrastructure",
  "app.infrastructure.database",
  "app.infrastructure.database.models",
]

[tool.pytest.ini_options]
pythonpath = ["."]
